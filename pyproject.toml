[project]
name = "autonomous-ai-trading-system"
version = "0.1.0"
description = "Autonomous multi-agent AI paper-trading platform: Gold, Silver, Bitcoin, Ethereum"
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hypothesis]
suppress_health_check = ["too_slow"]
