# Decision-engine parameters. Trades must clear expected-return-after-cost.
decision:
  min_net_expected_return: 0.004      # 0.4% net of all costs
  min_agreement_score: 0.6            # forecast + technical + regime votes
  max_uncertainty_ratio: 1.5          # |expected_return| may not exceed uncertainty x this
  horizon_hours:
    "1h": 24
    "4h": 96
    "1d": 168
  regime_suitability:
    trending_up:    {long: 1.0, short: 0.4}
    trending_down:  {long: 0.4, short: 1.0}
    sideways:       {long: 0.5, short: 0.5}
    high_volatility: {long: 0.3, short: 0.3}
    low_volatility: {long: 0.6, short: 0.6}
  stop_atr_multiple: 2.0
  take_profit_rr: 1.8                  # TP = RR * stop distance

# Cost model per asset class, basis points unless noted
costs:
  crypto:
    taker_fee_bps: 10
    spread_bps: 4
    slippage_bps: 5
    funding_bps_per_day: 3
  metals:
    taker_fee_bps: 5
    spread_bps: 3
    slippage_bps: 4
    funding_bps_per_day: 1

paper_trading:
  starting_capital_usd: 100000
  fill_delay_seconds: [1, 5]          # simulated execution delay range
